<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <title>TEL-MOUSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <p id="status">Connexion…</p>

  <div id="pad">
    <span class="coin coin-hg">TEL-MOUSE</span>
    <span class="coin coin-hd" id="hud-coord">X 000 · Y 000</span>

    <!-- Le HUD : plusieurs couches SVG empilées, chacune tourne à sa propre vitesse -->
    <div id="hud" class="hors-ligne">
      <div class="halo" id="hud-halo"></div>

      <!-- Couche 1 : arcs cyan extérieurs + 4 « nœuds » -->
      <svg class="couche" id="c-externe" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="200" cy="200" r="192" pathLength="100" class="c" stroke-width="2.5"
                stroke-dasharray="22 4 9 3 31 5 14 12" fill="none"/>
        <circle cx="200" cy="200" r="184" pathLength="100" class="c" stroke-width="1"
                stroke-dasharray="60 40" opacity="0.35" fill="none"/>
        <g class="noeud"><circle cx="200" cy="8" r="9"/><circle cx="200" cy="8" r="3.5" class="point"/></g>
        <g class="noeud"><circle cx="392" cy="200" r="9"/><circle cx="392" cy="200" r="3.5" class="point"/></g>
        <g class="noeud"><circle cx="200" cy="392" r="9"/><circle cx="200" cy="392" r="3.5" class="point"/></g>
        <g class="noeud"><circle cx="8" cy="200" r="9"/><circle cx="8" cy="200" r="3.5" class="point"/></g>
      </svg>

      <!-- Couche 2 : graduations + arc rouge -->
      <svg class="couche" id="c-graduations" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="200" cy="200" r="172" pathLength="100" class="c" stroke-width="7"
                stroke-dasharray="0.25 1.75" opacity="0.45" fill="none"/>
        <circle cx="200" cy="200" r="164" pathLength="100" class="r" stroke-width="1.5"
                stroke-dasharray="18 82" fill="none"/>
      </svg>

      <!-- Couche 3 : anneau de segments avec étiquettes -->
      <svg class="couche" id="c-segments" viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <path id="chemin-texte" d="M200,62 A138,138 0 1 1 199.99,62"/>
        </defs>
        <circle cx="200" cy="200" r="146" pathLength="100" stroke="#0c1517" stroke-width="28"
                stroke-dasharray="7.33 1" fill="none"/>
        <circle cx="200" cy="200" r="146" pathLength="100" class="c" stroke-width="28"
                stroke-dasharray="7.33 1" opacity="0.07" fill="none"/>
        <circle cx="200" cy="200" r="160" class="c" stroke-width="1" opacity="0.35" fill="none"/>
        <circle cx="200" cy="200" r="132" class="c" stroke-width="1" opacity="0.35" fill="none"/>
        <text class="etiquette">
          <textPath href="#chemin-texte" startOffset="3%">CURSEUR</textPath>
        </text>
        <text class="etiquette">
          <textPath href="#chemin-texte" startOffset="28%">DÉFIL</textPath>
        </text>
        <text class="etiquette">
          <textPath href="#chemin-texte" startOffset="53%">CLIC</textPath>
        </text>
        <text class="etiquette">
          <textPath href="#chemin-texte" startOffset="78%">LIAISON</textPath>
        </text>
      </svg>

      <!-- Couche 4 : anneau lumineux hachuré (change de couleur selon le geste) -->
      <svg class="couche" id="c-hachures" viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <filter id="lueur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="flou"/>
            <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="200" cy="200" r="122" pathLength="100" stroke="#fff" stroke-width="5"
                stroke-dasharray="0.15 0.85" opacity="0.5" fill="none"/>
        <circle cx="200" cy="200" r="116" class="a" stroke-width="1.5" opacity="0.7" fill="none"/>
        <g filter="url(#lueur)">
          <circle cx="200" cy="200" r="104" pathLength="100" class="a" stroke-width="20"
                  stroke-dasharray="1.1 1.4" fill="none"/>
          <circle cx="200" cy="200" r="104" pathLength="100" stroke="#fff" stroke-width="7"
                  stroke-dasharray="1.1 1.4" opacity="0.85" fill="none"/>
        </g>
        <circle cx="200" cy="200" r="92" class="a" stroke-width="1.5" fill="none"/>
        <!-- Repères asymétriques : sans eux, un anneau régulier semble immobile quand il tourne -->
        <circle cx="200" cy="200" r="104" pathLength="100" stroke="#050607" stroke-width="24"
                stroke-dasharray="5 95" fill="none"/>
        <circle cx="200" cy="200" r="119" pathLength="100" class="a" stroke-width="4"
                stroke-dasharray="9 41" fill="none"/>
      </svg>

      <!-- Couche 5 : tirets intérieurs (tournent vite) -->
      <svg class="couche" id="c-tirets" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="200" cy="200" r="76" pathLength="100" stroke="#fff" stroke-width="1"
                stroke-dasharray="1 3" opacity="0.35" fill="none"/>
        <circle cx="200" cy="200" r="64" pathLength="100" class="a" stroke-width="7"
                stroke-dasharray="3.2 1.8" fill="none"/>
        <!-- Repère : un arc blanc bien visible qui fait le tour -->
        <circle cx="200" cy="200" r="73" pathLength="100" stroke="#fff" stroke-width="3"
                stroke-dasharray="10 90" fill="none"/>
      </svg>

      <!-- Couche 6 : cœur -->
      <svg class="couche" id="c-coeur" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="200" cy="200" r="46" stroke="#fff" stroke-width="1.5" opacity="0.85" fill="none"/>
        <circle cx="200" cy="200" r="52" pathLength="100" class="c" stroke-width="2"
                stroke-dasharray="38 62" fill="none"/>
      </svg>

      <!-- Centre : vitesse + mode -->
      <div id="hud-centre">
        <span id="hud-valeur">000</span>
        <span id="hud-mode">PRÊT</span>
      </div>

      <!-- Onde de choc lors d'un clic -->
      <div id="hud-onde"></div>
    </div>
  </div>

  <div id="boutons">
    <button id="btn-gauche" type="button">Clic gauche<small>L</small></button>
    <button id="btn-droit" type="button">Clic droit<small>R</small></button>
  </div>

  <!-- Écran de verrouillage : par-dessus tout, tant que le code n'est pas validé -->
  <div id="verrou" hidden>
    <div id="verrou-boite">
      <svg class="verrou-icone" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="10" y="21" width="28" height="20" rx="3"/>
        <path d="M16 21v-6a8 8 0 0 1 16 0v6"/>
        <circle cx="24" cy="31" r="2.5"/>
      </svg>
      <p id="verrou-titre">ACCÈS SÉCURISÉ</p>
      <form id="verrou-form" novalidate>
        <input id="verrou-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               autocomplete="one-time-code" placeholder="000000" aria-label="Code d'accès à 6 chiffres">
        <button id="verrou-bouton" type="submit">Déverrouiller</button>
      </form>
      <p id="verrou-message" role="status"></p>
    </div>
  </div>

  <!-- hud.js et verrou.js d'abord : pad.js utilise les objets HUD et VERROU qu'ils créent -->
  <script src="/js/hud.js"></script>
  <script src="/js/verrou.js"></script>
  <script src="/js/pad.js"></script>
</body>
</html>
